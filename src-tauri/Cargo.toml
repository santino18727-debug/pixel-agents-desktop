[package]
name = "pixel-agents-desktop"
version = "0.1.0"
description = "Pixel Agents — standalone desktop viewer for Claude Code sessions"
authors = ["GabiDevFamily contributors"]
license = "MIT"
repository = "https://github.com/santino18727-debug/pixel-agents-desktop"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pixel_agents_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["full"] }
notify = "6"
notify-debouncer-full = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
dirs = "5"
walkdir = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
